<!doctype html><html><head><meta charset="utf-8"><title>overflow-x lock probe</title></head>
<body style="margin:0">
<pre id="out">running...</pre>
<script>
/* Stricter than audit_text.html: proves the horizontal pan-lock at ENGINE level.
   Per width W it reports: computed overflow-x of html+body, overscroll-behavior,
   scroll==client, ALL out-of-bounds element rects, and whether the scroller can
   actually be dragged sideways (scrollLeft assignment result). w=1440 is the
   desktop control: same locks must hold while pixel layout stays untouched. */
var W=[320,360,390,414,1440],out=[],done=0;
W.forEach(function(w){
  var f=document.createElement('iframe');
  f.style.cssText='border:0;display:block;width:'+w+'px;height:900px';
  f.src='../index.html';
  f.onload=function(){
    setTimeout(function(){
    try{
      var d=f.contentDocument,cw=d.documentElement.clientWidth,
          sw=(d.scrollingElement||d.documentElement).scrollWidth,
          cs=function(el){return f.contentWindow.getComputedStyle(el)},
          hx=cs(d.documentElement).overflowX,bx=cs(d.body).overflowX,
          ob=cs(d.documentElement).overscrollBehaviorX,offs=[];
      d.querySelectorAll('body *').forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.right>cw+1||r.left<-1){
          var c=el.className;
          c=(typeof c==='string')?c.split(' ')[0]:'svg';
          offs.push(el.tagName+'.'+c+' L'+Math.round(r.left)+' R'+Math.round(r.right));
        }
      });
      offs=offs.slice(0,14);
      var se=d.scrollingElement||d.documentElement;
      se.scrollLeft=60;var panned=se.scrollLeft;se.scrollLeft=0;
      out.push({w:w,client:cw,scroll:sw,htmlOvX:hx,bodyOvX:bx,obX:ob,
                overflow:sw>cw+1,pannedByJs:panned,n:offs.length,list:offs});
      }catch(e){out.push({w:w,err:String(e)});}
      if(++done===W.length)document.getElementById('out').textContent='PROBE::'+JSON.stringify(out);
    },700);
  };
  document.body.appendChild(f);
});
</script>
</body></html>
